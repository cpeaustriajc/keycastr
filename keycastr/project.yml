name: KeyCastr
options:
  bundleIdPrefix: io.github.keycastr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1.0.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    COMBINE_HIDPI_IMAGES: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  Visualizer:
    type: framework
    platform: macOS
    sources:
      - path: Visualizer
    settings:
      base:
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keycastr.Visualizer
        PRODUCT_NAME: Visualizer
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@loader_path/Frameworks"

  KCDefaultVisualizer:
    type: bundle
    platform: macOS
    sources:
      - path: Plugins/DefaultVisualizer
    dependencies:
      - target: Visualizer
        embed: false
        link: true
    settings:
      base:
        WRAPPER_EXTENSION: kcplugin
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keycastr.KCDefaultVisualizer
        PRODUCT_NAME: KCDefaultVisualizer
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"
          - "@executable_path/../Frameworks"
        INFOPLIST_KEY_NSPrincipalClass: DefaultVisualizerFactory
        INFOPLIST_KEY_CFBundlePackageType: BNDL

  Svelte:
    type: bundle
    platform: macOS
    sources:
      - path: Plugins/Svelte
    dependencies:
      - target: Visualizer
        embed: false
        link: true
    settings:
      base:
        WRAPPER_EXTENSION: kcplugin
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keycastr.Svelte
        PRODUCT_NAME: Svelte
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"
          - "@executable_path/../Frameworks"
        INFOPLIST_KEY_NSPrincipalClass: SvelteVisualizerFactory
        INFOPLIST_KEY_CFBundlePackageType: BNDL

  KeyCastr:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/Assets.xcassets
    dependencies:
      - target: Visualizer
        embed: true
        codeSign: true
      - target: KCDefaultVisualizer
        link: false
        embed: false
      - target: Svelte
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keycastr.KeyCastr
        PRODUCT_NAME: KeyCastr
        CODE_SIGN_ENTITLEMENTS: KeyCastr.entitlements
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2009-2026 Stephen Deken, Andrew Kitchen, and contributors."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Embed PlugIns
        script: |
          set -e
          PLUGIN_DIR="${TARGET_BUILD_DIR}/${PRODUCT_NAME}.app/Contents/PlugIns"
          mkdir -p "$PLUGIN_DIR"
          for plugin in KCDefaultVisualizer Svelte; do
            SRC="${TARGET_BUILD_DIR}/${plugin}.kcplugin"
            if [ -d "$SRC" ]; then
              rsync -a --delete "$SRC" "$PLUGIN_DIR/"
              /usr/bin/codesign --force --sign - --timestamp=none "$PLUGIN_DIR/${plugin}.kcplugin" || true
            fi
          done

  KeyCastrTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Plugins/DefaultVisualizer
      - path: Plugins/Svelte
    dependencies:
      - target: Visualizer
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keycastr.KeyCastrTests
        PRODUCT_NAME: KeyCastrTests

schemes:
  KeyCastr:
    build:
      targets:
        Visualizer: all
        KCDefaultVisualizer: all
        Svelte: all
        KeyCastr: all
    run:
      config: Debug
      executable: KeyCastr
    test:
      config: Debug
      targets:
        - KeyCastrTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
